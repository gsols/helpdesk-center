<!DOCTYPE html><html class="h-full" lang="en" style="width: 1280px; height: 1024px; overflow: hidden; position: relative;"><head>

                      "on-tertiary": "#ffffff",
                      "secondary-container": "#e0e3e5",

                      "background": "#f8f9ff",
                      "surface-bright": "#f8f9ff",

                      "inverse-surface": "#213145",

                      "on-tertiary-fixed": "#271901",

              "borderRadius": {

                      "xl": "0.5rem",

              },
              "spacing": {
                      "gutter": "16px",
                      "container-padding": "24px",
                      "stack-md": "8px",
                      "sidebar-width": "260px",
                      "shell-nav-width": "64px",

              },
              "fontFamily": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .login-card-shadow {
            box-shadow: 0 4px 12px 0 rgba(15, 23, 42, 0.1);
        }
        input:focus {
            outline: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="h-full bg-slate-50 font-body-md text-on-surface flex items-center justify-center p-gutter">
<!-- Primary Authentication Container -->
<main class="w-full max-w-[440px]">
<!-- Branding Header (Suppressed Nav Shell as per instructions for Transactional Login) -->
<div class="mb-stack-md flex justify-center">
<div class="flex items-center gap-2">
<div class="bg-primary p-2 rounded-none">
<span class="material-symbols-outlined text-white" style="font-variation-settings: &quot;FILL&quot; 1;">security</span>
</div>
<h1 class="font-headline-sm text-headline-sm tracking-tight text-on-surface uppercase">OmniSupport</h1>
</div>
</div>
<!-- Auth Card -->
<div class="bg-white border border-slate-200 rounded-none login-card-shadow p-8 md:p-12 relative overflow-hidden">
<!-- Atmospheric Aesthetic Element -->
<div class="absolute top-0 left-0 w-1 h-full bg-slate-900"></div>
<div class="space-y-6">
<header class="space-y-1">
<h2 class="font-display-sm text-display-sm text-on-surface">Gateway Access</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Authorize your secure support session.</p>
</header>
<form class="space-y-5" id="loginForm" onsubmit="return false;">
<!-- Workspace ID Field -->
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="workspace-id">Workspace ID</label>
<div class="relative group">
<input class="w-full h-8 px-3 bg-white border border-slate-300 font-technical-md text-technical-md text-on-surface focus:border-blue-500 rounded-none transition-colors" id="workspace-id" placeholder="company-subdomain" required="" type="text">
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-technical-md text-slate-400 text-[11px]">.omnisupport.io</span>
</div>
</div>
<!-- Email Field -->
<div class="space-y-stack-sm">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="email">Corporate Email</label>
<input class="w-full h-8 px-3 bg-white border border-slate-300 font-body-md text-body-md text-on-surface focus:border-blue-500 rounded-none transition-colors" id="email" placeholder="agent@company.com" required="" type="email">
</div>
<!-- Password Field -->
<div class="space-y-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-secondary uppercase" for="password">Password</label>
<a class="font-label-caps text-[10px] text-blue-600 hover:underline uppercase" href="#">Forgot Security Key?</a>
</div>
<div class="relative">
<input class="w-full h-8 px-3 bg-white border border-slate-300 font-body-md text-body-md text-on-surface focus:border-blue-500 rounded-none transition-colors" id="password" placeholder="••••••••••••" required="" type="password">
<button class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-2 space-y-4">
<button class="w-full h-10 bg-slate-900 text-white font-title-md text-title-md uppercase tracking-wider hover:bg-black active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" id="submitButton" type="submit" onclick="window.location.href='{{DATA:SCREEN:SCREEN_33}}'">
<span class="">Authenticate &amp; Enter</span>
<span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>

<div class="grid grid-cols-2 gap-3">


</div>
</div>
</form>
</div>
<!-- Footer metadata inside card -->

</div>
<!-- Secondary Links -->
<nav class="mt-8 flex justify-center gap-6">



</nav>
</main>
<!-- Subtle Background Elements -->
<div class="fixed inset-0 -z-10 opacity-20 pointer-events-none overflow-hidden">
<div class="absolute top-0 right-0 w-[600px] h-[600px] bg-blue-100/50 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/2"></div>
<div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-slate-200/50 rounded-full blur-[100px] translate-y-1/2 -translate-x-1/2"></div>
<!-- Grid Pattern -->
<div class="absolute inset-0" style="background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 40px 40px;"></div>
</div>
<script>
        // Micro-interaction for form submission
        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitButton');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const originalText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Verifying...</span>
            `;

            // Simulate network latency
            setTimeout(() => {
                submitBtn.innerHTML = `
                    <span class="material-symbols-outlined">check_circle</span>
                    <span>Access Granted</span>
                `;
                submitBtn.classList.replace('bg-slate-900', 'bg-emerald-600');
                
                setTimeout(() => {
                    // Reset or Redirect logic would go here
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalText;
                    submitBtn.classList.replace('bg-emerald-600', 'bg-slate-900');
                }, 2000);
            }, 1500);
        });

        // Floating label interaction simulation (minimalist)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling?.classList.remove('text-primary');
            });
        });
    </script>


</body></html>
