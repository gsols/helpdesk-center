<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helpdesk Center — Login</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { slate: { 950: '#0B0F19' } } } } }</script>
</head>
<body class="h-screen overflow-hidden bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-50 font-sans antialiased flex items-center justify-center">

  <!-- Ambient backdrop grid, subtle -->
  <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.06]" style="background-image: linear-gradient(currentColor 1px, transparent 1px), linear-gradient(90deg, currentColor 1px, transparent 1px); background-size: 32px 32px;"></div>

  <div class="relative w-full max-w-sm mx-4">
    <!-- brand mark -->
    <div class="flex items-center gap-2 justify-center mb-6">
      <div class="w-8 h-8 rounded-md bg-blue-600 flex items-center justify-center text-white font-bold text-xs">HC</div>
      <span class="font-semibold text-lg">Helpdesk Center</span>
    </div>

    <!-- Hard-edged elevated panel -->
    <div class="rounded-none border border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-2xl shadow-slate-950/10 dark:shadow-black/40 p-7">
      <h1 class="text-base font-semibold mb-1">Sign in to your workspace</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">Enter your workspace ID and credentials to continue.</p>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-medium text-slate-600 dark:text-slate-300">Workspace ID</label>
          <div class="mt-1 flex items-center rounded-md border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500 transition-all duration-150 ease-in-out overflow-hidden">
            <input type="text" placeholder="acme-corp" class="w-full px-3 py-2 bg-transparent text-sm focus:outline-none"/>
            <span class="pr-3 text-xs text-slate-400">.helpdesk.io</span>
          </div>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600 dark:text-slate-300">Corporate email</label>
          <input type="email" placeholder="you@company.com" class="mt-1 w-full px-3 py-2 rounded-md border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-150 ease-in-out"/>
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600 dark:text-slate-300">Password</label>
          <input type="password" placeholder="••••••••" class="mt-1 w-full px-3 py-2 rounded-md border border-slate-200/80 dark:border-slate-700 bg-white dark:bg-slate-800 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all duration-150 ease-in-out"/>
        </div>

        <button class="w-full py-2 rounded-md bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-colors">
          Sign in
        </button>

        <!-- error state example -->
        <div class="flex items-center gap-2 text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-900/50 rounded-md px-3 py-2">
          <span class="w-1.5 h-1.5 rounded-full bg-red-500 shrink-0"></span>
          Invalid email or password. Try again.
        </div>
      </div>

      <div class="mt-5 pt-4 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between text-xs">
        <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400">Forgot password?</a>
        <a href="#" class="text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400">Need an account?</a>
      </div>
    </div>

    <p class="text-center text-[11px] text-slate-400 dark:text-slate-600 mt-4">Multi-tenant access is isolated per workspace ID.</p>
  </div>

</body>
</html>
