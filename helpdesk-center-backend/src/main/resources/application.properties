spring.application.name=helpdesk-center-backend
spring.config.import=optional:file:.env[.properties]

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.write-dates-as-timestamps=false

# ── App Server ─────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:helpdesk-center-dev-jwt-secret-helpdesk-center-dev-jwt-secret-2026}
app.jwt.expiration-ms=604800000

# ── IBM Watson NLU ─────────────────────────────────────────
watson.nlu.api-key=${WATSON_API_KEY}
watson.nlu.url=${WATSON_URL}
watson.nlu.version=2023-08-01

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://helpdesk-center.vercel.app}

# ── File uploads ───────────────────────────────────────────
file.upload-dir=./uploads
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Email (Spring Mail) ────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:no-reply@helpdesk.local}

# ── App base URL (used in email links) ─────────────────────
app.base-url=${APP_BASE_URL:http://localhost:5173}
