spring.application.name=helpdesk-center-backend

# ── Database ──────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.write-dates-as-timestamps=false

# ── App Server ─────────────────────────────────────────────
server.port=${PORT:8080}

# ── JWT ────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# ── IBM Watson NLU ─────────────────────────────────────────
watson.nlu.api-key=${WATSON_API_KEY}
watson.nlu.url=${WATSON_URL}
watson.nlu.version=2023-08-01

# ── CORS ───────────────────────────────────────────────────
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ── File uploads ───────────────────────────────────────────
file.upload-dir=./uploads
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
