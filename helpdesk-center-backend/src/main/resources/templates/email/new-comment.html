<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Reply on Your Ticket</title>
  <style>
    body { margin:0; padding:0; font-family:-apple-system,"Segoe UI",sans-serif; background:#f4f6f8; color:#1f2328; }
    .wrapper { max-width:600px; margin:32px auto; background:#ffffff; border:1px solid #e5e7eb; border-radius:6px; overflow:hidden; }
    .header  { background:#0b1c30; padding:24px 32px; }
    .header h1 { margin:0; font-size:18px; color:#ffffff; font-weight:700; letter-spacing:-0.01em; }
    .header span { font-size:13px; color:#94a3b8; }
    .body    { padding:28px 32px; }
    .body p  { margin:0 0 16px; font-size:15px; line-height:1.6; color:#374151; }
    .comment-box { background:#f1f5f9; border-left:4px solid #3b82d4; padding:14px 18px; border-radius:0 4px 4px 0; margin:20px 0; font-size:14px; color:#1f2328; line-height:1.65; white-space:pre-wrap; }
    .btn { display:inline-block; margin-top:8px; padding:10px 22px; background:#0b1c30; color:#ffffff; font-size:13px; font-weight:700; text-decoration:none; border-radius:4px; }
    .footer { padding:16px 32px; border-top:1px solid #e5e7eb; font-size:12px; color:#9ca3af; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <h1>ClassifAi</h1>
    <span>Ticket notification</span>
  </div>
  <div class="body">
    <p>Hi <strong th:text="${recipientName}">User</strong>,</p>
    <p>
      <strong th:text="${senderName}">Someone</strong> left a new reply on ticket
      <strong th:text="'TCK-' + ${ticketId}">TCK-0</strong>
      &mdash; <em th:text="${ticketTitle}">Ticket Title</em>:
    </p>
    <div class="comment-box" th:text="${commentBody}">Comment body</div>
    <p>
      <a class="btn" th:href="${ticketUrl}">View Ticket</a>
    </p>
  </div>
  <div class="footer">
    You received this email because you are a participant on the ticket above.
    If you no longer wish to receive these emails, contact your administrator.
  </div>
</div>
</body>
</html>
